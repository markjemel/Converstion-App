<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    </head>
    <body>
        <main class="converter">
            <header class="converter__header">
                <h1 class="converter__title">Metric/Imperial Unit Conversion</h1>
                <input class="converter__input" id="value" type="number" aria-label="Value to convert" value = "20">
                <button class="converter__button" id="convert" type="button">Convert</button>
            </header>

        <section class="converter__results">
            <article class="card">
            <h2 class="card__title">Length (Meter/Feet)</h2>
            <p class="card__text" id="length">20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
            </article>
            <article class="card">
            <h2 class="card__title">Volume (Liters/Gallons)</h2>
            <p class="card__text" id="volume">20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
            </article>
            <article class="card">
            <h2 class="card__title">Mass (Kilograms/Pounds)</h2>
            <p class="card__text" id="mass">20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
            </article>
        </section>
        </main>
        <script type="module" src="/index.js"></script>
    </body>
</html>
